spring:
  application:
    name: halilov-market
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/halilov}
    username: ${DB_USER:halilov}
    password: ${DB_PASSWORD:halilov_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Jerusalem
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    # Surface ResponseStatusException reason strings in the JSON body's
    # `message` field. Without this Spring ships only `{status, error, path}`
    # and our Hebrew copy ("אנא בחרו סיסמה שונה מהקודמת" etc.) is invisible
    # to the SPA. Stack traces and binding-errors stay off — only the
    # human-readable message is added.
    include-message: always

management:
  endpoints:
    web:
      # Health is needed by docker healthcheck + nginx upstream wait.
      # /info is deliberately NOT exposed — once we add build-info it
      # would leak Spring / library versions to anyone unauthenticated.
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

app:
  admin:
    # Comma-separated IPs or CIDR blocks that bypass the admin 2FA challenge.
    # Bare IPv4 / IPv6 ({@code 1.2.3.4}, {@code 2a00:...:20ed}) or CIDR
    # ({@code 10.0.0.0/8}, {@code 2a00:a041:e9c4:f400::/64}). Prefer /64 for
    # IPv6 — SLAAC rotates the host portion, only the prefix is stable.
    # Empty = 2FA always required once an admin has enrolled.
    trustedIps: ${ADMIN_TRUSTED_IPS:}
  totp:
    # Label shown in the user's authenticator app (Google Authenticator, etc).
    issuer: ${TOTP_ISSUER:Halilov Admin}
  security:
    # Where the AnomalyMonitor sends alerts (failed-login bursts, sign-up
    # abuse, cancellation spikes). Falls back to app.email.adminBcc when not
    # set. Empty + empty adminBcc = monitor runs no-op (logs only).
    alertEmail: ${SECURITY_ALERT_EMAIL:${EMAIL_ADMIN_BCC:}}
  cors:
    # Comma-separated origins permitted to call /api/**. Empty = deny all
    # cross-origin requests (the default, since SPA + API share an origin via
    # nginx). Set CORS_ALLOWED_ORIGINS in prod only if you ever split them.
    allowedOrigins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-32+chars-min}
    expirationMinutes: 60
  init:
    admin:
      email: ${INIT_ADMIN_EMAIL:admin@halilov.local}
      password: ${INIT_ADMIN_PASSWORD:admin123!}
      fullName: ${INIT_ADMIN_FULL_NAME:Admin}
  payment:
    # mock = in-app fake checkout (dev). disabled = hard-stop (prod, until a
    # real gateway is wired). paypal = PayPal hosted approval (real money).
    provider: ${PAYMENT_PROVIDER:mock}
    # Absolute base the PayPal approval flow returns to — the SPA's origin.
    # Falls back to the email siteBaseUrl (prod). Set PAYMENT_RETURN_BASE_URL to
    # the dev origin (e.g. http://localhost:5173) when testing PayPal locally.
    returnBaseUrl: ${PAYMENT_RETURN_BASE_URL:${app.email.siteBaseUrl:}}
    paypal:
      # PayPal Checkout (server-side Orders v2). clientId + secret from the
      # PayPal Developer dashboard — sandbox creds are instant + free; live
      # creds need a verified PayPal Business account. Keep in env, never commit.
      # baseUrl selects the environment:
      #   sandbox: https://api-m.sandbox.paypal.com
      #   prod:    https://api-m.paypal.com
      baseUrl:      ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
      clientId:     ${PAYPAL_CLIENT_ID:}
      clientSecret: ${PAYPAL_CLIENT_SECRET:}
      # Webhook id from the dashboard, used to verify webhook signatures so a
      # forged "payment completed" callback can't flip an order to PAID.
      webhookId:    ${PAYPAL_WEBHOOK_ID:}
      currency:     ${PAYPAL_CURRENCY:ILS}
  greenInvoice:
    # Green Invoice ("morning") issues the legal קבלה (receipt, doc type 400) on
    # every successful charge. The GI account MUST be configured as עוסק פטור so
    # the document carries no VAT. apiKeyId + apiKeySecret from GI Settings → API
    # — keep in env. baseUrl selects the environment:
    #   sandbox: https://sandbox.d.greeninvoice.co.il/api/v1
    #   prod:    https://api.greeninvoice.co.il/api/v1
    baseUrl:      ${GREEN_INVOICE_BASE_URL:https://sandbox.d.greeninvoice.co.il/api/v1}
    apiKeyId:     ${GREEN_INVOICE_API_KEY_ID:}
    apiKeySecret: ${GREEN_INVOICE_API_KEY_SECRET:}
    documentType: ${GREEN_INVOICE_DOC_TYPE:400}
  receipt:
    # When true, the paid-order email tells the buyer the official קבלה will be
    # emailed by hand within a business day — the lean launch flow while the
    # Green Invoice API plan is deferred. Flip to false once GI API issuance is
    # enabled so the email reflects instant issuance.
    manualNotice: ${RECEIPT_MANUAL_NOTICE:false}
  delivery:
    courierFlatAgorot: ${DELIVERY_COURIER_AGOROT:1990}
    freeAboveAgorot:   ${DELIVERY_FREE_ABOVE_AGOROT:30000}
  media:
    storage: ${MEDIA_STORAGE:local}
    localDir: ${MEDIA_DIR:./media}
    r2:
      endpoint: ${R2_ENDPOINT:}
      accessKeyId: ${R2_ACCESS_KEY_ID:}
      secretAccessKey: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      publicBaseUrl: ${R2_PUBLIC_BASE_URL:}
  email:
    provider: ${EMAIL_PROVIDER:log}
    fromEmail: ${EMAIL_FROM:no-reply@halilov.local}
    fromName: ${EMAIL_FROM_NAME:חלילוב אונליין}
    adminBcc: ${EMAIL_ADMIN_BCC:}
    siteBaseUrl: ${SITE_BASE_URL:}
    brevo:
      apiKey: ${BREVO_API_KEY:}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
