worker_processes auto;
events { worker_connections 1024; }

# TLS variant — terminates HTTPS at the edge with a Cloudflare Origin Certificate.
# Activate by setting NGINX_CONF_FILE=nginx.tls.conf in infra/.env.
#
# Files expected (drop via scp into infra/nginx/certs/):
#   /etc/nginx/certs/origin.pem  Cloudflare Origin Certificate (PEM)
#   /etc/nginx/certs/origin.key  Cloudflare Origin Certificate private key
#
# Cloudflare DNS must point root + admin A records at the VM, proxy (orange cloud) ON.
# SSL/TLS mode in Cloudflare dashboard: "Full (strict)".

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Cloudflare passes real IP in CF-Connecting-IP. We only trust this header
    # from Cloudflare's own edge ranges — otherwise an attacker who reaches the
    # origin directly (VM public IP) could spoof CF-Connecting-IP and bypass
    # per-IP rate limits below. Source: https://www.cloudflare.com/ips/
    # Keep in sync periodically (CF publishes changes via their API).
    real_ip_header CF-Connecting-IP;
    # Cloudflare IPv4 ranges
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # Cloudflare IPv6 ranges
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # Docker internal bridge — backend container talks to edge over this.
    set_real_ip_from 172.16.0.0/12;

    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    client_max_body_size 20m;

    # Per-IP rate limits — protects 1-OCPU backend from spikes/abuse.
    # CF-Connecting-IP is mapped to $remote_addr above, so zones key on real client IP.
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_status 429;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers applied to every response. CSP keeps script/connect
    # sources locked to self so a future XSS can't exfiltrate the JWT in
    # localStorage. 'unsafe-inline' on styles is needed because the SPAs use
    # inline style attributes; revisit when we move to CSS-in-JS extraction.
    # img-src allows https: so product images from R2 + Cloudflare CDN work.
    # frame-ancestors 'none' blocks clickjacking. HSTS deliberately left to
    # Cloudflare (origin cert path can stall renewals if we lock browsers in).
    map $sent_http_content_type $csp_value {
        default "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'";
    }
    add_header Content-Security-Policy $csp_value always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ----- :80 — redirect everything to HTTPS -----
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ----- admin.<domain> -----
    server {
        listen 443 ssl;
        http2  on;
        server_name ~^admin\..+$;

        # /api/auth/me is a JWT session check, hit on every app mount — keep it
        # in the generous api zone, not the strict auth zone (which is for
        # brute-forceable login/register).
        location = /api/auth/me {
            limit_req zone=api burst=20 nodelay;
            set $u_backend backend:8080;
            proxy_pass http://$u_backend$request_uri;
        }
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            set $u_backend backend:8080;
            proxy_pass http://$u_backend$request_uri;
        }
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            set $u_backend backend:8080;
            proxy_pass http://$u_backend$request_uri;
        }
        location /actuator/health {
            set $u_backend backend:8080;
            proxy_pass http://$u_backend$request_uri;
        }
        location / {
            limit_req zone=general burst=60 nodelay;
            set $u_admin admin:80;
            proxy_pass http://$u_admin$request_uri;
        }
    }

    # ----- root + www (shop) -----
    server {
        listen 443 ssl default_server;
        http2  on;
        server_name _;

        location = /api/auth/me {
            limit_req zone=api burst=20 nodelay;
            set $u_backend backend:8080;
            proxy_pass http://$u_backend$request_uri;
        }
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            set $u_backend backend:8080;
            proxy_pass http://$u_backend$request_uri;
        }
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            set $u_backend backend:8080;
            proxy_pass http://$u_backend$request_uri;
        }
        location /actuator/health {
            set $u_backend backend:8080;
            proxy_pass http://$u_backend$request_uri;
        }
        # Dynamic sitemap — generated by backend (includes active products).
        location = /sitemap.xml {
            limit_req zone=general burst=60 nodelay;
            set $u_backend backend:8080;
            proxy_pass http://$u_backend$request_uri;
        }
        location / {
            limit_req zone=general burst=60 nodelay;
            set $u_shop shop:80;
            proxy_pass http://$u_shop$request_uri;
        }
    }
}
